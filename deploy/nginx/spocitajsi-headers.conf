# Spoločné hlavičky pre web SpočítajSi (vkladá sa do server aj location blokov,
# lebo nginx nededí add_header do blokov, ktoré majú vlastné add_header).
# Na serveri: /etc/nginx/snippets/spocitajsi-headers.conf
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# X-Frame-Options zámerne chýba: kalkulačky sa majú dať vložiť na iné weby (?embed=1)
