# nginx konfigurácia pre statický web SpočítajSi na analyzer.renak.eu
# Na serveri: /etc/nginx/sites-available/analyzer.renak.eu  (KÓPIA, nie odkaz –
# certbot do súboru dopíše HTTPS a pri aktualizácii repozitára by sa to stratilo)
#
# Zodpovedá súborom _headers a _redirects (tie číta len Cloudflare Pages / Netlify).

server {
    listen 80;
    listen [::]:80;
    server_name analyzer.renak.eu;

    root /var/www/spocitajsi;
    index index.html;
    charset utf-8;
    # presmerovania (/pn -> /pn/) bez domény a protokolu, funguje rovnako cez HTTP aj HTTPS
    absolute_redirect off;

    access_log /var/log/nginx/analyzer.renak.eu.access.log;
    error_log  /var/log/nginx/analyzer.renak.eu.error.log;

    include /etc/nginx/snippets/spocitajsi-headers.conf;

    # kompresia (HTML sa komprimuje vždy, ostatné typy treba vymenovať)
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_types text/css text/plain text/javascript application/javascript application/json
               application/xml image/svg+xml application/manifest+json;

    error_page 404 /404.html;
    location = /404.html { internal; }

    # domovská stránka (index.html) – musí byť pred pravidlom pre staré *.html adresy
    location = /index.html { }

    # staré adresy /nazov.html -> /nazov/ (ako _redirects)
    location ~ ^/([a-z0-9-]+)\.html$ {
        return 301 /$1/;
    }

    # neverejné súbory z repozitára
    location ~ ^/(tests|tools|deploy|node_modules)(/|$) { return 404; }
    location ~ /\.(?!well-known/)                      { return 404; }
    location ~* \.(md|sh)$                             { return 404; }
    location ~ ^/_(headers|redirects)$                 { return 404; }

    # CSS/JS majú v adrese verziu (?v=hash), obrázky sa menia zriedka
    location ^~ /assets/ {
        include /etc/nginx/snippets/spocitajsi-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # skript pre cudzie weby (vložené kalkulačky) – bez verzie, preto krátka cache
    location = /embed.js {
        include /etc/nginx/snippets/spocitajsi-headers.conf;
        add_header Cache-Control "public, max-age=3600";
        add_header Access-Control-Allow-Origin "*";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
